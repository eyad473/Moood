name: Build Clean APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Clean APK
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/abuareban/camp
          cat > settings.gradle <<'EOF'
          include ':app'
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.1.4'
          }
          android {
              namespace 'com.abuareban.camp'
              compileSdk 33
              defaultConfig {
                  applicationId "com.abuareban.camp"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="مخيم ابو عريبان">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/abuareban/camp/MainActivity.java <<'EOF'
          package com.abuareban.camp;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              protected void onCreate(Bundle b){
                  super.onCreate(b);
                  WebView w=new WebView(this);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.getSettings().setDomStorageEnabled(true);
                  w.setWebViewClient(new WebViewClient());
                  w.loadUrl("https://moood.eyad2000515.workers.dev/");
                  setContentView(w);
              }
          }
          EOF
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mokhayam-Clean-APK
          path: app/build/outputs/apk/debug/app-debug.apk
