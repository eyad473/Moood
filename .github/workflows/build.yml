name: Build APK Now
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    container: mingc/android-build-box
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/mokhayam/app
          echo "include ':app'" > settings.gradle
          cat > app/build.gradle <<'ENDG'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.mokhayam.app'
              compileSdk 33
              defaultConfig {
                  applicationId "com.mokhayam.app"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          ENDG
          cat > app/src/main/AndroidManifest.xml <<'ENDM'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="مخيم ابو عريبان">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          ENDM
          cat > app/src/main/java/com/mokhayam/app/MainActivity.java <<'ENDJ'
          package com.mokhayam.app;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              protected void onCreate(Bundle b){
                  super.onCreate(b);
                  WebView w=new WebView(this);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.getSettings().setDomStorageEnabled(true);
                  w.setWebViewClient(new WebViewClient(){
                    public boolean shouldOverrideUrlLoading(WebView v, String url){ v.loadUrl(url); return true; }
                  });
                  w.loadUrl("https://moood.eyad2000515.workers.dev/");
                  setContentView(w);
              }
              public void onBackPressed(){ WebView w=(WebView)findViewById(android.R.id.content).getRootView(); if(w!=null && w.canGoBack()) w.goBack(); else super.onBackPressed(); }
          }
          ENDJ
          gradle :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mokhayam-APK-Jahez
          path: app/build/outputs/apk/debug/app-debug.apk
