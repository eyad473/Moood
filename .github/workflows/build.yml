name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/abuareban/camp
          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          include ':app'
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.2.2' apply true
          }
          android {
            namespace 'com.abuareban.camp'
            compileSdk 34
            defaultConfig {
              applicationId "com.abuareban.camp"
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="مخيم ابو عريبان">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/abuareban/camp/MainActivity.java <<'EOF'
          package com.abuareban.camp;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
            protected void onCreate(Bundle b){
              super.onCreate(b);
              WebView w=new WebView(this);
              w.getSettings().setJavaScriptEnabled(true);
              w.getSettings().setDomStorageEnabled(true);
              w.setWebViewClient(new WebViewClient());
              w.loadUrl("https://moood.eyad2000515.workers.dev/");
              setContentView(w);
            }
          }
          EOF
          gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AbuAreban-APK
          path: app/build/outputs/apk/debug/app-debug.apk
